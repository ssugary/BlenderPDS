<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui { 
      position: absolute; top: 10px; left: 10px; z-index: 10; 
      background: rgba(30, 30, 30, 0.85); padding: 10px; border-radius: 6px; color: #fff; 
    }
    button { margin: 2px; cursor: pointer; background: #444; color: #fff; border: 1px solid #666; padding: 5px 10px; }
  </style>
</head>
<body>
  <script type="module" src="/src/Main.js"></script>

  <div id="ui">
    <select id="addGeometry">
      <option value="">Geometries</option>
      <option value="cube">Cube</option>
      <option value="cylinder">Cylinder</option>
      <option value="torus">Torus</option>
    </select>
    <button id="add">add</button>
    <button id="deleteObject">Apagar (X)</button>
    <button id="translate">Mover (G)</button>
    <button id="rotate">Rotacionar (R)</button>
    <button id="scale">Escalar (S)</button>
    <button id="walkNav"> Andar </button>
    <button id="vertex"> Vertices </button>
    <button id="face"> Faces </button>
    <button id="edge"> Arestas </button>
    <button id="editMode"> Modo de Edição </button>
    <button id="addModel">+ Modelo</button>
    <button id="exportModel">Exportar Modelo</button>
  </div>
</body>
</html>
