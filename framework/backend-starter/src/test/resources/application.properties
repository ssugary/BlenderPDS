spring.application.name=blenderpds

# The datasource comes from the compose.yaml integration (spring-boot-docker-compose),
# which reads POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB and the mapped port.
# The compose file lives at the repo root (one Postgres for the whole monorepo); the path is
# relative to the module directory, which is the working directory of both the tests and
# `spring-boot:run`.
spring.docker.compose.file=../../compose.yaml
spring.docker.compose.skip.in-tests=false

# The schema is owned by Flyway (src/main/resources/db/migration). V1__baseline.sql reproduces
# exactly what Hibernate used to create on every start, so Hibernate now only validates it —
# recreating the schema on start (the old ddl-auto=create) threw the data away.
spring.jpa.hibernate.ddl-auto=validate
# The dev/test database already has the Hibernate-created schema and no Flyway history: baselining
# at V1 lets Flyway adopt that schema instead of refusing a non-empty database. A brand new
# database has no baseline at all and runs V1 normally.
spring.flyway.baseline-on-migrate=true

# SMTP: by default it points at the Mailpit from compose.yaml (local dev).
# In production, override through environment variables (MAIL_HOST, MAIL_PORT...).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Fail fast when the SMTP server is not up (avoids hanging the registration).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# E-mail sender and the public base used in the confirmation link.
app.mail.from=${MAIL_FROM:no-reply@blenderpds.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Origins accepted on the WebSocket handshake (/ws/sessions/{id}). The Vite dev
# server runs on 5173 — but it binds every interface, so the page may well be opened
# as http://<lan-ip>:5173; the wildcard host keeps that working (the browser's Origin
# is what it is, not localhost). With no Origin header (tests, tools) the check passes.
# In production set WS_ALLOWED_ORIGINS to the real site origin.
collab3d.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://*:5173}
