      background: rgba(30, 30, 30, 0.85); padding: 10px; border-radius: 6px; color: #fff; 
    }
    button { margin: 2px; cursor: pointer; background: #444; color: #fff; border: 1px solid #666; padding: 5px 10px; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {

      }
    }
  </script>
  
  <div id="ui">
    <button id="addCube">+ Cubo</button>
    <button id="translate">Mover (G)</button>
    <button id="rotate">Rotacionar (R)</button>
    <button id="scale">Escalar (S)</button>
    <button id="walkNav"> Andar </button>
  </div>

  <script src="Main.js" type="module"> </script>

</html>
