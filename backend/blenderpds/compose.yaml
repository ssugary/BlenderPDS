services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=blenderpds'
      - 'POSTGRES_PASSWORD=senha123'
      - 'POSTGRES_USER=blender'
    ports:
      - '5432'
    volumes:
      - 'blenderpds-data:/var/lib/postgresql/data'

  # Servidor SMTP local para desenvolvimento: a UI em http://localhost:8025
  # mostra os e-mails enviados (inclusive o de confirmação de cadastro).
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  blenderpds-data: