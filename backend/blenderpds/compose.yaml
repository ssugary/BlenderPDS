services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=blenderpds'
      - 'POSTGRES_PASSWORD=senha123'
      - 'POSTGRES_USER=blender'
    ports:
      - '5432'
    volumes:
      - 'blenderpds-data:/var/lib/postgresql/data'

  # Local SMTP server for development: the UI at http://localhost:8025 shows the
  # e-mails sent (including the registration confirmation one).
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  blenderpds-data: