spring.application.name=blenderpds

# The datasource comes from the compose.yaml integration (spring-boot-docker-compose),
# which reads POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB and the mapped port.
spring.docker.compose.skip.in-tests=false

# Creates/updates the entity schema in development.
spring.jpa.hibernate.ddl-auto=update

# SMTP: by default it points at the Mailpit from compose.yaml (local dev).
# In production, override through environment variables (MAIL_HOST, MAIL_PORT...).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Fail fast when the SMTP server is not up (avoids hanging the registration).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# E-mail sender and the public base used in the confirmation link.
app.mail.from=${MAIL_FROM:no-reply@blenderpds.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Origins accepted on the WebSocket handshake (/ws/sessions/{id}). The Vite dev
# server runs on 5173 — but it binds every interface, so the page may well be opened
# as http://<lan-ip>:5173; the wildcard host keeps that working (the browser's Origin
# is what it is, not localhost). With no Origin header (tests, tools) the check passes.
# In production set WS_ALLOWED_ORIGINS to the real site origin.
app.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://*:5173}
