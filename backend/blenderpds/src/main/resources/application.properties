spring.application.name=blenderpds

# Datasource vem da integração com o compose.yaml (spring-boot-docker-compose),
# que lê POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB e a porta mapeada.
spring.docker.compose.skip.in-tests=false

# Cria/atualiza o schema das entidades em desenvolvimento.
spring.jpa.hibernate.ddl-auto=update

# SMTP: por padrão aponta para o Mailpit do compose.yaml (dev local).
# Em produção, sobrescreva via variáveis de ambiente (MAIL_HOST, MAIL_PORT...).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Falha rápido se o servidor SMTP não estiver no ar (evita travar o registro).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remetente do e-mail e base pública usada no link de confirmação.
app.mail.from=${MAIL_FROM:no-reply@blenderpds.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}
